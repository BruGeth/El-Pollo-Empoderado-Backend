spring:
  profiles:
    active: local  # perfil por defecto

  jpa:
    hibernate:
      ddl-auto: update  # crea o actualiza las tablas automáticamente (puedes cambiar a validate más adelante)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForPolloEmpoderadoBackend2024}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos
